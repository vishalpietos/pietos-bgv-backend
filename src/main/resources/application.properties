spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}
server.address=0.0.0.0

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Meta WhatsApp Cloud API
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID}
whatsapp.api-version=${WHATSAPP_API_VERSION}

# File upload
file.upload-dir=${FILE_UPLOAD_DIR:/tmp/uploads}

# Application encryption
app.encryption.key=${APP_ENCRYPTION_KEY}

# Tesseract
tesseract.path=${TESSERACT_PATH:/usr/bin/tesseract}
tesseract.language=${TESSERACT_LANGUAGE:eng}
